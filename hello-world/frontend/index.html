<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penumbra Tech — Tech consulting &amp; software solutions</title>
    <meta
      name="description"
      content="Penumbra Tech helps businesses and freelancers turn complex problems into clean software and reliable systems. Reliable code. Real impact."
    />
    <meta name="theme-color" content="#0B1220" />

    <!-- Brand fonts. Preconnect for the handshake, then a single
         stylesheet pulling Space Grotesk for headings and Inter for
         body. JetBrains Mono is loaded for the few places we render
         code samples. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Inline SVG favicon: simple circled P matching the brand logo. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1220'/%3E%3Cg stroke='%232563EB' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='32' cy='32' r='24'/%3E%3Cpath d='M24 18 L24 48 M24 18 L38 18 a8 8 0 0 1 0 16 L24 34'/%3E%3C/g%3E%3C/svg%3E"
    />

    <script type="module" src="/src/main.jsx"></script>

    <style>
      /* Defaults: dark background while React hydrates, plus
         brand-appropriate base font. The actual layout and footer are
         owned by Layout.jsx now, not by index.html. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b1220;
        color: #e8eef7;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Custom-scrollbar treatment on webkit browsers so the scroll
         track doesn't look like a Windows 95 leftover against the dark
         surface. */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0b1220;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2a44;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2b3759;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
