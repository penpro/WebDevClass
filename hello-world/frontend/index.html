<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penumbra Tech: software, AWS, Unreal Engine, and reliability work</title>
    <meta
      name="description"
      content="Single-engineer consulting practice building full-stack web apps, AWS infrastructure, Unreal Engine systems, and the performance / reliability tooling that keeps it all from quietly falling over."
    />
    <meta name="theme-color" content="#07021a" />

    <!-- Canonical + social cards. The values below are the homepage
         defaults; per-route titles/descriptions are overridden by the
         useDocumentMeta hook in each page component, then baked into
         the prerendered HTML by puppeteer (see prerender.js). -->
    <link rel="canonical" href="https://penumbra-tech.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://penumbra-tech.com/" />
    <meta property="og:site_name" content="Penumbra Tech" />
    <meta property="og:title" content="Penumbra Tech: software, AWS, Unreal Engine, and reliability work" />
    <meta
      property="og:description"
      content="Single-engineer consulting practice building full-stack web apps, AWS infrastructure, Unreal Engine systems, and the performance / reliability tooling that keeps it all from quietly falling over."
    />
    <meta property="og:image" content="https://penumbra-tech.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Penumbra Tech: software, AWS, Unreal Engine, and reliability work" />
    <meta
      name="twitter:description"
      content="Single-engineer consulting practice for full-stack software, cloud infrastructure, game systems, and reliability work."
    />
    <meta name="twitter:image" content="https://penumbra-tech.com/og-card.png" />

    <!-- Brand fonts are self-hosted via @fontsource (see main.jsx). The
         woff2 files are bundled by Vite into /assets/ and served from
         our own origin with the immutable cache header. No third-party
         font CDN, no extra DNS / TLS handshake. -->

    <!-- Inline SVG favicon: circled P in the corona color. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307021a'/%3E%3Cg stroke='%235eead4' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='32' cy='32' r='24'/%3E%3Cpath d='M24 18 L24 48 M24 18 L38 18 a8 8 0 0 1 0 16 L24 34'/%3E%3C/g%3E%3C/svg%3E"
    />

    <!-- Structured data: tells Google, Bing, etc. that this is a real
         professional-services business with a founder, a service area,
         a price range, and concrete offers. Helps the knowledge panel
         pick Penumbra Tech up as an entity and improves rich-snippet
         appearance in search results. Mirrors fields that are visible
         elsewhere on the site (about page, services page, contact page)
         so it's not making claims that don't show up in the prose. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Penumbra Tech",
        "description": "Single-engineer consulting practice building full-stack web apps, AWS infrastructure, Unreal Engine systems, and the performance / reliability tooling that keeps it all from quietly falling over.",
        "url": "https://penumbra-tech.com",
        "image": "https://penumbra-tech.com/og-card.png",
        "logo": "https://penumbra-tech.com/og-card.png",
        "telephone": "+1-360-850-7876",
        "email": "wesley@penumbra-tech.com",
        "priceRange": "$$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kitsap County",
          "addressRegion": "WA",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "Place", "name": "Kitsap County, Washington" },
          { "@type": "Place", "name": "Washington State" },
          { "@type": "Place", "name": "United States (remote)" }
        ],
        "founder": {
          "@type": "Person",
          "name": "Wesley Weaver Jr.",
          "url": "https://penumbra-tech.com/about",
          "sameAs": [
            "https://github.com/penpro",
            "https://www.linkedin.com/in/wesley-weaver-31726629/"
          ]
        },
        "sameAs": [
          "https://github.com/penpro",
          "https://www.linkedin.com/in/wesley-weaver-31726629/"
        ],
        "knowsAbout": [
          "Custom web application development",
          "AWS infrastructure",
          "Node.js and Express",
          "React",
          "MySQL",
          "Unreal Engine",
          "Performance engineering",
          "Reliability engineering"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Engagement shapes",
          "itemListElement": [
            { "@type": "Offer", "name": "Diagnostic Week", "price": "5000", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Build Sprint", "priceSpecification": { "@type": "PriceSpecification", "minPrice": "10000", "maxPrice": "25000", "priceCurrency": "USD" } },
            { "@type": "Offer", "name": "Hourly retainer", "price": "250", "priceCurrency": "USD", "unitText": "HOUR" }
          ]
        }
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <style>
      /* Defaults: dark background while React hydrates, plus
         brand-appropriate base font. The actual layout and footer are
         owned by Layout.jsx now, not by index.html. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #07021a;
        color: #ecfeff;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Custom scrollbar in the corona palette so it reads as
         intentional chrome rather than a leftover from the default OS. */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #07021a;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a1a55;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a2575;
      }
      ::selection {
        background: rgba(94, 234, 212, 0.3);
        color: #ecfeff;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
