# Just the five security add_header lines, factored out so they can be
# included from both the server-level and from every individual
# `location` block.
#
# Why this file exists: nginx's `add_header` inheritance rule.  The
# moment a child location block calls add_header (e.g. for Cache-Control
# on /assets/), nginx REPLACES every parent add_header directive for
# responses from that location — including the security headers defined
# at server scope.  The result is that CSP / HSTS / X-Frame-Options /
# X-Content-Type-Options / Referrer-Policy were silently stripped from
# every HTML and /assets/ response while still appearing on /api/*
# (where no child location adds its own header).
#
# The fix is to re-establish them inside every location that uses
# add_header.  Maintaining them here in one file means we don't have to
# remember to update five copies when the CSP changes.
#
# Pulled from security-headers.conf (the comments explaining each
# header live in that file, not here, to keep this snippet copy-clean).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://api.stripe.com https://maps.stripe.com https://api.github.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
