# Security headers for the hello-app site.
#
# Include this file inside the HTTPS server block in
# /etc/nginx/sites-available/hello-app on the EC2 server:
#
#   include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers.conf;
#
# Then test + reload:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# This keeps the headers version-controlled in the repo and out of
# certbot-managed config blocks.

# --- Transport security ---------------------------------------------------

# Tell browsers to always use HTTPS for this domain for the next year,
# even if the user types http://. includeSubDomains is safe here because
# we own the full domain (penumbra-tech.com — and the legacy
# penumbrapro.duckdns.org subdomain) and don't have any HTTP-only
# subdomains underneath either.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Content sniffing / framing / referrer --------------------------------

# Prevent the browser from MIME-sniffing a response away from the
# declared Content-Type. Stops text/html from being interpreted as
# something executable if the Content-Type is wrong.
add_header X-Content-Type-Options "nosniff" always;

# Prevent the site from being embedded in an <iframe> on another domain.
# Stops clickjacking attacks. "DENY" means nobody can frame us, not even
# ourselves. Change to "SAMEORIGIN" if you ever need to embed the site
# inside itself.
add_header X-Frame-Options "DENY" always;

# Controls what the browser sends in the Referer header when navigating
# away from the site. "strict-origin-when-cross-origin" sends the full
# URL for same-origin requests (useful for analytics) but only the
# origin (no path) when navigating to another domain, and nothing at all
# when downgrading from HTTPS to HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Content Security Policy ----------------------------------------------

# Strict enough to block the most common injection attacks without breaking
# the existing SPA, with carefully-scoped exceptions for Stripe.
#
# Breakdown:
#   default-src 'self'        — fallback for everything: only load from us
#   script-src  'self' https://js.stripe.com
#                              — JS from our origin and Stripe.js. Stripe
#                                injects its checkout/Elements code from
#                                js.stripe.com; without this entry the
#                                Payment Element silently fails to render.
#   style-src   'self' 'unsafe-inline'
#                              — CSS from our origin + inline <style> tags
#                                (the moodboard hover CSS and the index.html
#                                footer CSS both use inline <style>)
#   img-src     'self' https: data:
#                              — images from our origin, any HTTPS URL
#                                (moodboard tiles load from arbitrary hosts),
#                                and data: URIs (some libraries use them)
#   font-src    'self'        — fonts from our origin only
#   connect-src 'self' https://api.stripe.com https://maps.stripe.com
#                              — fetch / XHR only to our origin and Stripe's
#                                API endpoints (the Payment Element makes
#                                live calls to api.stripe.com to confirm
#                                payments; maps.stripe.com is used for some
#                                Address Element features)
#   frame-src   'self' https://js.stripe.com https://hooks.stripe.com
#                              — the Payment Element renders inside iframes
#                                hosted by Stripe (the card input itself is
#                                cross-origin so card data never touches our
#                                JS — that's the PCI compliance trick). 3D
#                                Secure challenges may also use hooks.stripe.com.
#   frame-ancestors 'none'    — equivalent to X-Frame-Options DENY but
#                                more modern and overrides it if both are set
#   base-uri    'self'        — prevents <base> tag injection
#   form-action 'self'        — form submissions only to our origin
#
# If a future feature needs a CDN, a font host, or another external API,
# add the origin to the relevant directive here rather than weakening the
# whole policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://api.stripe.com https://maps.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# --- Upload size --------------------------------------------------------
# TaskTrackr progress updates accept media uploads. Free-tier users are
# capped at 10 MB images; premium / admin / super_admin users can post
# video up to 100 MB. Set the nginx ceiling to 110m to allow the 100 MB
# file plus multipart envelope overhead to make it through. Multer
# enforces the actual per-tier per-file limit on the application side.
client_max_body_size 110m;
