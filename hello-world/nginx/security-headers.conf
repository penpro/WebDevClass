# Security headers for the hello-app site.
#
# Include this file inside the HTTPS server block in
# /etc/nginx/sites-available/hello-app on the EC2 server:
#
#   include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers.conf;
#
# Then test + reload:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# This keeps the headers version-controlled in the repo and out of
# certbot-managed config blocks.
#
# The five security headers themselves live in a snippet file
# (security-headers-snippet.conf) and get re-included inside every
# location block that calls add_header.  Why: nginx's add_header
# inheritance rule REPLACES every parent add_header the moment a
# child location calls add_header of its own, which would otherwise
# silently strip the security headers from /assets/, /index.html,
# and /toc/ responses.  Found by a round-2 audit when curl -sI on
# the home page showed only Cache-Control and ETag.

# --- Security headers (server scope, propagates to /api/*) --------------
#
# Header rationale:
#
#   Strict-Transport-Security  Force HTTPS for a year; includeSubDomains
#                              is safe because we own the full domain.
#   X-Content-Type-Options     "nosniff" — stop MIME-type sniffing.
#   X-Frame-Options            "DENY" — block clickjacking.
#   Referrer-Policy            "strict-origin-when-cross-origin" — full
#                              URL same-origin, origin only cross-origin,
#                              nothing on HTTPS->HTTP downgrade.
#   Content-Security-Policy    default 'self' + Stripe origins for the
#                              Payment Element (which iframes from
#                              js.stripe.com and POSTs to api.stripe.com).
#                              Brand fonts are self-hosted via
#                              @fontsource so font-src can stay 'self'.
#
# If a future feature needs a CDN, font host, or external API: edit
# security-headers-snippet.conf (single source of truth) and reload.
include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers-snippet.conf;

# --- Upload size --------------------------------------------------------
# TaskTrackr progress updates accept media uploads. Free-tier users are
# capped at 10 MB images; premium / admin / super_admin users can post
# video up to 100 MB. Set the nginx ceiling to 110m to allow the 100 MB
# file plus multipart envelope overhead to make it through. Multer
# enforces the actual per-tier per-file limit on the application side.
client_max_body_size 110m;

# --- Compression --------------------------------------------------------
# Without this, the 400KB+ React bundle ships uncompressed. Gzip drops it
# to ~120KB. brotli would drop to ~95KB but requires the nginx-extras
# package (apt install nginx-extras + brotli on; brotli_types ...) — add
# later if first paint is still slow after gzip.
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

# --- Static asset cache + SPA fallback location blocks -----------------
# These location blocks live in this shared include so they stay in
# version control and don't drift on individual server boxes.

# Vite emits content-hashed bundle names (index-<hash>.js, etc.), so
# every byte under /assets/ is safe to cache forever. `immutable` tells
# the browser not to even revalidate. Cuts repeat-visit JS payload to
# zero bytes after the first load.
location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|eot|svg)$ {
    include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers-snippet.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The SPA shell needs the OPPOSITE: browser must re-check on every load
# so new bundle hashes pick up immediately on deploy. try_files re-enters
# location matching, so any path that falls through to /index.html gets
# this header.
location = /index.html {
    include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers-snippet.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Statically-served subtrees that have their own index.html (the live
# Theory of Computation tool at /toc/). Without an explicit location
# block, the generic SPA fallback either 403s or serves the React shell
# instead of the tool. Keep this list narrow — every entry here is a
# directory that exists under /var/www/hello-app/ with its own index.
location /toc/ {
    include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers-snippet.conf;
    try_files $uri $uri/index.html =404;
}

# Top-level public images (founder photo, og-card, repair360 screenshots,
# etc.) are NOT content-hashed by Vite, so they cannot use the immutable
# /assets/ rule above. Cache them for 30 days so repeat visitors don't
# re-fetch on every page load; that's long enough to matter for the
# common about-page-visit pattern and short enough that a deliberate
# update propagates within the month. Include the security snippet so
# parent add_headers don't get stripped (the inheritance trap again).
location ~* ^/[^/]+\.(jpg|jpeg|png|webp|gif|ico)$ {
    include /home/ubuntu/WebDevClass/hello-world/nginx/security-headers-snippet.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
